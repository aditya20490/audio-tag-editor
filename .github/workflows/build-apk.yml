name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Add layout, save helper and crop tool to the page
        run: |
          sed -i 's#</head>#<link rel="stylesheet" href="app.css"><script src="native-save.js"></script></head>#' www/index.html
          sed -i 's#</body>#<script src="crop.js"></script></body>#' www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Allow saving into the Download folder
        run: |
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AudioTagEditor.apk

      - name: Make release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Audio Tag Editor v${{ github.run_number }}
          files: AudioTagEditor.apk
